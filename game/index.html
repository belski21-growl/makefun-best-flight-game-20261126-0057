<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merpati Kilat — Probe r4 (three.js)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1a2e; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  /* Vignette + warm grade (CSS, tanpa composer — finishing visual probe). */
  #grade { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 55%, rgba(20,8,20,0.38) 100%),
                linear-gradient(rgba(255,180,90,0.05), rgba(255,180,90,0.05)); }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "./vendor/three.core.js": "./vendor/three.core.min.js"
  }
}
</script>
<!-- three.module.min.js r187 mengimpor ./three.core.js (relatif). Import map di atas
     memetakan URL itu ke three.core.min.js (minify jsDelivr yang sama, 422.062 byte,
     12 baris) — kedua file *.min.js lokal di game/vendor/, tanpa CDN, tanpa file
     library non-min. Lihat probe-r4.md. -->
</head>
<body>
<canvas id="gl" aria-label="Merpati Kilat probe: jet terbang rendah di ngarai Bromo saat fajar"></canvas>
<canvas id="hud"></canvas>
